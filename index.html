
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How are you? 💙</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #eafaff;
  background:
    radial-gradient(circle at top, #123d78, transparent 55%),
    linear-gradient(160deg, #020817, #071b3c, #00172d);
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(#8beaff 1px, transparent 1px),
    radial-gradient(#ffffff 1px, transparent 1px);
  background-size: 47px 47px, 83px 83px;
  background-position: 0 0, 24px 35px;
  opacity: 0.35;
}

.card {
  position: relative;
  width: min(90%, 440px);
  padding: 35px 24px;
  border: 1px solid #3c9dff66;
  border-radius: 25px;
  background: #06152bed;
  box-shadow: 0 0 35px #168bff30;
}

.alien {
  font-size: 58px;
  margin-bottom: 12px;
}

h1 {
  color: #80e6ff;
  font-size: 2.3rem;
  text-shadow: 0 0 18px #168bff88;
}

p {
  color: #c7dff7;
  line-height: 1.7;
}

button {
  padding: 12px 22px;
  margin: 7px;
  border: 1px solid #60cfff;
  border-radius: 25px;
  background: #0b3470;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #1460ad;
  box-shadow: 0 0 15px #168bff66;
}

#message {
  margin-top: 20px;
}

.question {
  color: #8beaff;
  font-size: 1.15rem;
}

footer {
  margin-top: 30px;
  color: #7299c7;
  font-size: 0.8rem;
}
</style>
</head>

<body>
<div class="stars"></div>

<main class="card">
  <div class="alien">💙👽✨</div>
  <h1>How are you?</h1>

  <p>
    Hey, you.<br>
    I hope you're doing okay.<br>
    There's something I've been wanting to ask you...
  </p>

  <button id="startButton" onclick="start()">
    I'm listening 💙
  </button>

  <div id="message" aria-live="polite"></div>

  <footer>somewhere under the same stars ✨</footer>
</main>

<script>
let currentQuestion = 0;

const questions = [
  "Do you still love me? 💙",
  "Do you think we can work things out? 🥹",
  "Do you think we can try again? 💌"
];

function start() {
  currentQuestion = 0;
  document.getElementById("startButton").style.display = "none";
  showQuestion();
}

function showQuestion() {
  const message = document.getElementById("message");

  message.innerHTML = `
    <p class="question">${questions[currentQuestion]}</p>
    <button onclick="answerYes()">Yes 💙</button>
    <button onclick="answerNo()">No</button>
  `;
}

function answerYes() {
  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    document.getElementById("message").innerHTML = `
      <p class="question">Thank you for sharing your feelings with me. 💙</p>
      <p>Whatever happens, I hope we can understand each other. ✨</p>
      <button onclick="restart()">Read again ↻</button>
    `;
  }
}

function answerNo() {
  document.getElementById("message").innerHTML = `
    <p class="question">It's okay. 💙</p>
    <p>Thank you for being honest with me. You don't have to give an answer you don't mean.</p>
    <button onclick="restart()">Back to the beginning ↻</button>
  `;
}

function restart() {
  document.getElementById("message").innerHTML = "";
  document.getElementById("startButton").style.display = "inline-block";
  currentQuestion = 0;
}
</script>

</body>
</html>
